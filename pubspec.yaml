name: nian_nian_bu_wang
description: |
  念念不忘 - 老人极简语音提醒+子女协同

  【首次使用必读】
  为确保息屏时提醒能准时响铃，请在安装后完成以下设置：
  1. 设置 → 电池 → 后台耗电管理 → 找到「念念不忘」→ 设为「允许后台耗电」
  2. 设置 → 电池 → 后台耗电管理 → 关闭「智能控制后台耗电」或把念念不忘设为「无限制」
  3. 若手机有「电池优化」选项，把念念不忘设为「不优化」

  不完成以上设置可能导致息屏后提醒不响！

  ---
  功能：
  · 极简语音输入，爸妈说一句话就能设提醒
  · 子女绑定后可远程帮爸妈设提醒
  · 息屏响铃，准时提醒不忘事
  · 子女端可查看提醒完成情况

publish_to: 'none'
version: 1.0.62

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # 网络
  http: ^1.2.0
  
  # 语音
  audioplayers: ^5.2.1
  speech_to_text: ^7.0.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  
  # 通知与闹钟
  flutter_local_notifications: ^18.0.1
  # v1.0.45: 移除flutter_background_service（导致闪退），改用原生Kotlin前台服务
  
  # 推送


  
  # 微信登录
  
  # 路由
  
  # 状态管理
  provider: ^6.1.1
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
