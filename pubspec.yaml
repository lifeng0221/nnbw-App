name: nian_nian_bu_wang
description: 念念不忘 - 老人极简语音提醒+子女协同

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # 网络
  http: ^1.2.0
  dio: ^5.4.0
  
  # 语音
  record: ^5.2.0
  audioplayers: ^5.2.1
  
  # 本地存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  
  # 通知与闹钟
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.6
  flutter_background_service: ^5.1.0
  
  # 推送


  
  # 微信登录
  fluwx: ^5.7.5
  
  # 路由
  go_router: ^13.2.0
  
  # 状态管理
  provider: ^6.1.1
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  url_launcher: ^6.2.4
  vibration: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/images/
