name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true
          cache-dependency-path: pubspec.lock
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee build.log
          echo "=== APK Size ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || echo "APK NOT FOUND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$VERSION"
          
          # 如果release已存在，删除重建；否则创建新release
          if gh release view "v$VERSION" --repo lifeng0221/nnbw-App > /dev/null 2>&1; then
            echo "Release v$VERSION exists, deleting..."
            gh release delete "v$VERSION" --yes --repo lifeng0221/nnbw-App
          fi
          echo "Creating release v$VERSION"
          gh release create "v$VERSION" \
            --title "念念不忘 v$VERSION" \
            --notes "念念不忘 v$VERSION" \
            --repo lifeng0221/nnbw-App
          echo "Uploading APK..."
          gh release upload "v$VERSION" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            --repo lifeng0221/nnbw-App \
            --clobber
