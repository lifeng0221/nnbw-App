name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true
          cache-dependency-path: pubspec.lock
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee build.log
          echo "=== APK Size ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || echo "APK NOT FOUND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "Creating release v$VERSION"
          # 先删掉已有的空release，再创建新的
          gh release delete "v$VERSION" --yes || true
          gh release create "v$VERSION" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            --title "念念不忘 v$VERSION" \
            --notes "念念不忘 v$VERSION"
